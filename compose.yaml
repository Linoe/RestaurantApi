services:
  server:
    build:
      context: .
      target: runtime
    ports:
      - "${API_PORT}:${API_CONTAINER_PORT}"
    environment:
      ASPNETCORE_HTTP_PORTS: "${API_CONTAINER_PORT}"
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "port=${POSTGRES_PORT}"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "${POSTGRES_PORT}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "restaurant", "-d", "restaurant"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  db-data:
